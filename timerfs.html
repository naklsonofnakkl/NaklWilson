<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Display View</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #game-title {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaa;
            margin-bottom: 10px;
        }

        /* Set up base structure rules here once */
        #timer {
            font-size: 15rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            padding: 20px 60px;
            border-radius: 20px;
            border: 10px solid #FFFFFF;
            transition: border-color 0.3s ease, color 0.3s ease;
            color: #FFFFFF;
        }

        /* Modifier classes only adjust colors */
        #timer.is-running {
            border-color: #43b72f !important;
            color: #43b72f !important;
        }

        #timer.is-stopped {
            border-color: #b72f2f !important;
            color: #b72f2f !important;
        }

        #timer-name {
    font-size: 2rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #ddd;
    margin-bottom: 6px;
    min-height: 2.4rem;   /* reserves space so the clock doesn't jump when a name appears/disappears */
}
    </style>
</head>

<body>

    <div id="game-title">Loading Game...</div>
    <div id="timer-name"></div>
    <div id="timer">--:--</div>

    <script>
        const gameNames = {
            "yo": "Yu-Gi-Oh!",
            "op": "One Piece",
            "rb": "RiftBound",
            "ua": "Union Arena",
            "ga": "Grand Archive",
            "dm": "Digimon",
            "ws": "Weiss Schwarz",
            "dbs": "DragonBall Super Fusion",
            "fb": "Flesh and Blood",
            "lc": "Lorcana",
            "gm": "Gundam",
            "mg": "Magic the Gathering",
            "pk": "Pokemon",
            "ff": "Final Fantasy",
            "pw": "Palworld",
            "cp": "Cyberpunk",
            "nr": "Naruto"
        };

        // 1. Add your favicon file paths or URLs here
        const favicons = {
            "yo": "./images/tcg_timer/favicons/yugioh.ico",
            "op": "./images/tcg_timer/favicons/onepiece.ico",
            "rb": "./images/tcg_timer/favicons/riftbound.ico",
            "ua": "./images/tcg_timer/favicons/unionarena.ico",
            "ga": "./images/tcg_timer/favicons/grandarchive.ico",
            "dm": "./images/tcg_timer/favicons/digimon.ico",
            "ws": "./images/tcg_timer/favicons/weissschwarz.ico",
            "dbs": "./images/tcg_timer/favicons/dragonball.ico",
            "fb": "./images/tcg_timer/favicons/fleshandblood.ico",
            "lc": "./images/tcg_timer/favicons/lorcana.ico",
            "gm": "./images/tcg_timer/favicons/gundam.ico",
            "mg": "./images/tcg_timer/favicons/mtg.ico",
            "pk": "./images/tcg_timer/favicons/pokemon.ico",
            "ff": "./images/tcg_timer/favicons/finalfantasy.ico",
            "pw": "./images/tcg_timer/favicons/palworld.ico",
            "default": "./favicon.ico" // Fallback icon
        };

        const urlParams = new URLSearchParams(window.location.search);
        const activeGame = urlParams.get('game');
        const activeInstance = urlParams.get('instance');

        const titleDisplay = document.getElementById('game-title');
        const clockDisplay = document.getElementById('timer');
        const nameDisplay = document.getElementById('timer-name');

        // 2. Helper function to find or create the favicon link tag
        function changeFavicon(src) {
            let link = document.querySelector("link[rel~='icon']");
            if (!link) {
                link = document.createElement('link');
                link.rel = 'icon';
                document.head.appendChild(link);
            }
            link.href = src;
        }

        if (activeGame && gameNames[activeGame]) {
            const label = activeInstance
                ? `${gameNames[activeGame]} — Timer ${activeInstance}`
                : gameNames[activeGame];
            titleDisplay.textContent = label;
            document.title = label;

            const iconPath = favicons[activeGame] || favicons["default"];
            changeFavicon(iconPath);
        } else {
            titleDisplay.textContent = "Unknown Event";
            changeFavicon(favicons["default"]);
        }

        const bc = new BroadcastChannel('tcg_timer_channel');

bc.onmessage = (event) => {
    const { type, game, time, status, instance, name } = event.data;
    const instanceMatches = activeInstance == null || String(instance) === activeInstance;

    if (type === 'UPDATE' && game === activeGame && instanceMatches) {
        clockDisplay.textContent = time;

        const fallbackName = activeInstance ? `Timer ${activeInstance}` : '';
        const displayName = name && name.trim() ? name : fallbackName;
        nameDisplay.textContent = displayName;

        if (status === "running") {
            clockDisplay.classList.add("is-running");
            clockDisplay.classList.remove("is-stopped");
        } else if (status === "stopped") {
            clockDisplay.classList.remove("is-running");
            clockDisplay.classList.add("is-stopped");
        } else if (status === "reset") {
            clockDisplay.classList.remove("is-running", "is-stopped");
        }
    }
};
    </script>
</body>

</html>
