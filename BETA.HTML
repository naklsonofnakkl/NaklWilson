    <style>
        :root {
            color-scheme: light dark;
            --bg-color: light-dark(#6abaf0, #111213);
            --text-color: light-dark(#ffffff, #c7c7c7);
            --card-color: light-dark(#2f6fb7, #1c1e20);
            --navbtn-color: light-dark(#1753b6, #50596c);
            --navbtnhover-color: light-dark(#1753b6, #3b82f6);
            --navbtnactive-color: light-dark(#3b82f6, #979ca7);
            --navbtnactiveborder-color: light-dark(#6abaf0, #50596c);
            --navbar-color: light-dark(#2f6fb7, #1c1e20);
            --navborder-color: light-dark(#e5e5e5, #979ca7);
            --btnspace-color: light-dark(#43b72f, #5ec44d);
            --btnspacehover-color: light-dark(#338b23, #338b23);
            --btnborder-color: light-dark(#e5e5e5, #979ca7);
            --btnactive-color: light-dark(#3b82f6, #1753b6);
            --btn-color: light-dark(#919bb1, #50596c);
            --btnhover-color: light-dark(#4a4f5a, #979ca7);
            --timerstop-color: light-dark(#eb3939, #c44d4d);
            --timerstopborder-color: light-dark(#791e1e, #791e1e);
            --timergo-color: light-dark(#66e94f, #5ec44d);
            --border-color: light-dark(#e5e5e5, #979ca7);
            --timerborder-color: light-dark(#e5e5e5, #979ca7);
            --timerbg-color: light-dark(#1753b6, #50596c);
            --link-color: light-dark(#ffbe5c, #3dc6a6);
            --btnTheme-color: light-dark(#0b0129, #77bbe9);
            --btnThemebr-color: light-dark(#1b0c47, #528594);
            --btnThemehover-color: light-dark(#2f245a, #cfb478);
            --btnThemehoverbr-color: light-dark(#ffffff, #ffffff);
            --indexreportbtn-color: light-dark(#bb1818, #bb1818);
            --indexreportbtnbr-color: light-dark(#791e1e, #791e1e);
            --indexnormalbg-color: light-dark(#1b64dc, #6c7892);
            --indexoffbg-color: light-dark(#091942, #141a1f);
            --indexnormaltext-color: light-dark(#ffffff, #c7c7c7);
            --indexofftext-color: light-dark(#ffffff, #ecedea);
            --indexofflinear: light-dark(linear-gradient(0deg, rgb(9, 25, 66) 0%, rgb(16, 59, 131) 6%), linear-gradient(0deg, rgba(20, 26, 31, 1) 0%, rgba(42, 46, 56, 1) 6%));
            --themebg-image: light-dark(url(./images/tcg_timer/ui/theme_dark_bg.webp), url(./images/tcg_timer/ui/theme_light_bg.webp));
            --logo: light-dark(url(./images/tcg_timer/ui/logo_light.webp), url(./images/tcg_timer/ui/logo_dark.webp));
            --kofi: light-dark(url(./images/badges/kofi_button_light.webp), url(./images/badges/kofi_button_dark.webp));
        }
        :root.light {
            color-scheme: light;
        }
        :root.dark {
            color-scheme: dark;
        }
        [hidden] {
            display: none !important;
        }
        html {
            font-size: 16px;
            &.dark {
                --indexofflinear: linear-gradient(0deg, rgba(20, 26, 31, 1) 0%, rgba(42, 46, 56, 1) 6%);
                --themebg-image: url(./images/tcg_timer/ui/theme_light_bg.webp);
                --kofi: url(./images/badges/kofi_button_dark.webp);
            }
            &.light {
                --indexofflinear: linear-gradient(0deg, rgb(9, 25, 66) 0%, rgb(16, 59, 131) 6%);
                --themebg-image: url(./images/tcg_timer/ui/theme_dark_bg.webp);
                --kofi: url(./images/badges/kofi_button_light.webp);
            }
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }
        h1,
        h2,
        h4,
        p {
            color: var(--text-color);
            text-wrap: pretty;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell',
                'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            margin: 5px;
        }
        a {
            color: var(--link-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell',
                'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        input {
            caret-color: #1753b6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell',
                'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        .kofi {
            content: var(--kofi);
        }
        .about-container,
        .update-container {
            background-color: var(--navbtn-color);
            border: 5px solid var(--border-color);
            color: var(--text-color);
            padding: 1rem;
            width: 100%;
            min-width: 150px;
            max-width: 350px;
            border-radius: 30px;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            display: flex;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 10px 10px;
        }
        .entry-header {
            width: 100%;
            text-align: center;
        }
        .entry-title {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-color);
        }
        .entry-subtitle {
            margin: 0.25rem 0 0;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-color);
            opacity: 0.7;
        }
        .entry-description {
            width: 100%;
            height: 250px;
            overflow-y: auto;
            color: var(--text-color);
            background: var(--indexoffbg-color);
            background: var(--indexofflinear);
            border: 2px solid var(--indexnormalbg-color);
            border-radius: 12px;
            padding: 0.75rem;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            z-index: 1;
        }
        .entry-description::-webkit-scrollbar {
            width: 8px;
        }
        .entry-description::-webkit-scrollbar-track {
            background: transparent;
        }
        .entry-description::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 8px;
        }
        .entry-controls {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
        }
        .column {
            display: flex;
            flex-direction: column;
            flex-flow: column nowrap;
            flex: 1 1 0;
            margin: 5px;
            min-width: 320px;
            max-height: 720px;
            overflow-x: auto;
            background: var(--indexoffbg-color);
            border: 5px solid var(--border-color);
            border-radius: 30px;
        }
        .column-1 {
            max-width: 260px;
            max-height: 720px;
            margin: 5px;
            min-width: 0;
            background: var(--card-color);
            border: 5px solid var(--border-color);
            border-radius: 30px;
        }
        .section-block {
            margin: 5px;
            height: 530px;
            padding: 10px;
        }
        .section-block-timer {
            margin: 5px;
            padding: 2px;
            overflow-x: auto;
        }
        .section-block-nav {
            margin: 5px;
            height: 78px;
            padding: 10px;
        }
        .section-block-timer-nav {
            margin: 5px;
            padding: 10px;
            background: var(--card-color);
            border: 3px solid var(--border-color);
            border-radius: 30px;
        }
        .section-label {
            font-size: 12px;
            color: #7a7669;
            margin: 0 0 10px;
        }
        .time {
            color: var(--text-color);
            &[is-running] {
                color: var(--timergo-color);
                text-shadow: var(--btnspacehover-color) 1px 0 10px;
            }
            &[is-stopped] {
                color: var(--timerstop-color);
                text-shadow: var(--timerstopborder-color) 1px 0 10px;
            }
        }
        .timer-tab {
            background: transparent;
        }
        .timer-tab-stopped {
            background: var(--timerstop-color);
        }
        .timer-tab-running {
            background: var(--timergo-color);
        }
        .timer-tab-active-view {
            outline: 2px solid var(--navbtnactive-color);
        }
        .toggle-btn {
            width: 100%;
            height: 52px;
            background: var(--navbtn-color);
            border-radius: 5px;
            border: 2px solid var(--navborder-color);
            &.active {
                background: var(--btnspace-color);
                border: 2px solid var(--timergo-color);
                .ui-button {
                    content: url(./images/tcg_timer/ui/confirm.webp);
                }
            }
        }
        .c1-row1 {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: 52px;
            gap: 8px;
            justify-content: center;
            align-items: center;
            align-content: center;
            height: 78px;
            background: var(--navbar-color);
        }
        .c1-row2 {
            display: grid;
            grid-template-rows: repeat(3, auto);
            grid-template-columns: 1fr;
            gap: 16px;
            z-index: 2; 
            background: var(--card-color);
        }
        .label-button-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .full-width-footer {
            display: flex;
            flex: 1 1 100%;
            order: 3;
            text-align: center;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            justify-self: center;
            align-items: center;
            padding: 16px;
            margin: 5px;
            font-size: 13px;
            color: #ffffff;
            max-height: 150px;
            align-self: flex-end;
            background: var(--card-color);
            border: 5px solid var(--border-color);
            overflow: hidden;
            gap: 8px;
            border-radius: 30px;
            width: 1280px;
            min-height: 80px;
        }
        .c2-row1 {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 12px;
            height: 78px;
            background: var(--navbar-color);
        }
        .c2-row2 {
            display: flex;
            flex-direction: column;
            z-index: 1; 
            gap: 16px;
        }
        .mini-grid {
            display: grid;
            grid-template-rows: repeat(4, auto) auto;
            gap: 6px;
            border: 1px solid var(--line);
            padding-top: 10px;
            padding-left: 4px;
            padding-right: 4px;
            background: var(--indexofflinear);
            border: 2px solid var(--border-color);
            border-radius: 30px;
        }
        .btn-row-32 {
            display: flex;
            flex-direction: row;
            gap: 6px;
            min-height: 62px;
            background: var(--card-color);
            justify-content: center;
            align-items: center;
            padding-left: 5px;
            overflow-x: auto;
            border-radius: 15px;
        }
        .btn-row-16 {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 42px;
            background: transparent;
            gap: 5px;
        }
        /* ---------- Buttons ---------- */
        button {
            font-family: inherit;
            border: 1px solid var(--btnborder-color);
            background: var(--btn-color);
            color: var(--btn-color);
            cursor: pointer;
            padding: 0;
        }
        .btn-52 {
            width: 100%;
            height: 52px;
            padding: 8px 4px;
            cursor: pointer;
            border: 2px solid var(--border-color);
            background-color: var(--navbtn-color);
            color: var(--text-color);
            border-radius: 6px;
            &.active {
                border-color: var(--navbtnactiveborder-color);
                background-color: var(--navbtnactive-color);
            }
            &.hover {
                background-color: var(--btnhover-color);
            }
        }
        .btn-125 {
            width: 130px;
            font-size: 13px;
            color: var(--navbtn-color);
            background: transparent;
            border: 0px transparent;
            border-radius: 15px;
            &.hover {
                background: var(--navbtnhover-color);
            }
            &.active {
                background: var(--navbtnactive-color);
                border: 1px solid var(--navborder-color)
            }
        }
        .btn-32 {
            width: 52px;
            height: 52px;
            background: var(--btn-color);
            border: 2px solid var(--border-color);
            flex: 0 0 auto;
            border-radius: 5px;
            &.hover {
                background: var(--btnhover-color);
            }
            &.active {
                background: var(--btnactive-color);
            }
        }
        .btn-16 {
            width: 32px;
            height: 32px;
            border: 0px transparent;
        }
        label.field-label {
            font-size: 16px;
            color: var(--text-color);
        }
        .timerDisplay {
            font-weight: bold;
            color: var(--text-color);
            padding-right: 5px;
        }
        [popover="hint"] {
            background-color: var(--card-color);
            color: var(--text-color);
        }
        #themeBtn {
            background-color: var(--btnTheme-color);
            border-color: var(--btnThemebr-color);
            width: 100%;
            background-image: var(--themebg-image);
        }
        #themeBtn:hover {
            background-color: var(--btnThemehover-color);
            border-color: var(--btnThemehoverbr-color);
        }
        #report-btn {
            background: var(--indexreportbtn-color);
            border-color: var(--indexreportbtnbr-color);
            font-weight: 600;
            color: #FFFFFF;
            height: 100%;
        }
        #report-btn:disabled {
            background: transparent;
        }
        .item {
            display: flex;
            height: 100%;
        }
        .item button {
            font-family: inherit;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            border-radius: 10px;
            padding: 0.5rem 0.9rem;
            font-size: 0.85rem;
            transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
        }
        .item button:hover:not(:disabled) {
            background: var(--navbtnactive-color);
            border-color: var(--navborder-color);
        }
        .item button:active:not(:disabled) {
            transform: scale(0.96);
        }
        .item button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .salt-wrap {
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .salt-wrap:hover {
            transform: translateY(-15px);
        }
        .salt-icon {
            display: block;
            width: fit-content;
            height: fit-content;
            aspect-ratio: 1/1;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20%,
            60% {
                transform: translateX(-6px);
            }
            40%,
            80% {
                transform: translateX(6px);
            }
        }
        @keyframes shrink-grow {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(0.7);
            }
            70% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }
        .salt-icon.shake {
            animation: shake 0.4s ease;
            cursor: grab;
        }
        .salt-icon.pop {
            animation: shrink-grow 0.35s ease;
            cursor: grabbing;
        }
        #timerSelection {
            width: 100%;
        }
        img.logo-button {
            height: auto;
            width: 125px;
            aspect-ratio: 16/9;
            justify-self: center;
        }
        img.label-button-cell {
            content: var(--logo);
            justify-self: center;
        }
        .clean-line {
            border: none;
            height: 2px;
            background-color: var(--border-color);
            width: 100%;
            margin: 2px 0;
        }
        @media (max-width: 1200px) {
                .btn-row-32 {
            justify-content: flex-start;
            scrollbar-width: auto;
        }
        }
    </style>
</head>
<body class="timers-container" style="-webkit-user-select:none;user-select:none;" unselectable="on"
    id="timers-container">
    <div class="column column-1">
        <div class="navbar-wrapper section-block-nav">
            <nav class="navbar-sm-container c1-row1" id="normal-navbar">
                <button class="btn-52 nav-sm-btn" id="nt" data-action="toggle" data-target="nt">
                    <picture class="logo-picture-sm">
                        <img class="logo-button-new" src=".\images\tcg_timer\ui\add.webp" alt="New Timer" width="32px"
                            height="32px">
                    </picture>
                </button>
                <div id="TimerTooltip" popover="hint">
                    Create Timer
                </div>
                <button class="btn-52 nav-sm-btn" id="set" data-action="toggle" data-target="set">
                    <picture class="logo-picture-sm">
                        <img class="logo-button-set" src=".\images\tcg_timer\ui\settings.webp" alt="Settings"
                            width="32px" height="32px">
                    </picture>
                </button>
                <div id="SettingsTooltip" popover="hint">
                    Settings Menu
                </div>
                <button class="btn-52 nav-sm-btn" id="close" data-action="close-timer">
                    <picture class="logo-picture-sm">
                        <img class="logo-button-del" src=".\images\tcg_timer\ui\delete.webp" alt="Close" width="32px"
                            height="32px">
                    </picture>
                </button>
                <div id="CloseTooltip" popover="hint">
                    Close Timers
                </div>
            </nav>
        </div>
        <div id="timer-settings-container"></div>
        <section id="timerScreen-nt" class="settingScreen-card section-block" hidden>
            <div class="settings-container c1-row2">
                <div id="gameTimer" class="label-button-cell">
                    <label for="timerSelection" class="field-label">
                        <h2>Choose a Timer:</h2>
                    </label>
                    <hr class="clean-line">
                    <select id="timerSelection" name="Games">
                        <option disabled selected value>-- Select a Game --</option>
                        <option value="dm">Digimon</option>
                        <option value="dbs">DragonBall Super Fusion</option>
                        <option value="ff">Final Fantasy</option>
                        <option value="fb">Flesh and Blood</option>
                        <option value="ga">Grand Archive</option>
                        <option value="gm">Gundam</option>
                        <option value="lc">Lorcana</option>
                        <option value="mg">Magic the Gathering</option>
                        <option value="op">One Piece</option>
                        <option value="pw">Palworld</option>
                        <option value="pk">Pokémon</option>
                        <option value="rb">Riftbound</option>
                        <option value="ua">Union Arena</option>
                        <option value="ws">Weiss Schwarz</option>
                        <option value="yo">YuGiOh!</option>
                    </select>
                </div>
                <div class="button-timer field-label">
                    <button id="createBtn" class="button btn-52" data-action="choose-timer"
                        data-select="timerSelection">
                        <picture class="ui-picture"> <img class="ui-button" src=".\images\tcg_timer\ui\confirm.webp"
                                alt="confirm">
                    </button>
                    <div id="CreateTooltip" popover="hint">
                        Create the selected Timer
                    </div>
                </div>
            </div>
        </section>
        <section id="timerScreen-set" class="settingScreen-card section-block" hidden>
            <label for="Settings">
                <h2>Settings</h2>
            </label>
            <hr class="clean-line">
            <div class="timers-container c1-row2">
                <div id="settingsTimer">
                    <div class="settings-area">
                        <div class="settings-theme-switcher settings-button-container label-button-cell">
                            <label id="themeLabel" for="theme" class="settings-label field-label">
                                Switch Themes:
                            </label>
                            <button class="nav-set-btn settings-control btn-52" id="themeBtn" data-action="toggle"
                                data-target="theme">
                                <picture class="logo-picture-sm">
                                    <img class="logo-button-theme" src=".\images\tcg_timer\ui\light.webp" alt="Theme"
                                        width="32px" height="32px">
                                </picture>
                            </button>
                            <div id="ThemeTooltip" popover="hint">
                                Switch Themes
                            </div>
                        </div>
