            <article>
<div class="card">
  <h1>Contact Form</h1>
  <p class="subtitle">Fill out the form below and it will be sent to admin@naklwilson.net</p>

  <form id="contactForm">
    <label for="name">Name <span class="required">*</span></label>
    <input type="text" id="name" name="name" required>

    <label for="reason">Reason for Report <span class="required">*</span></label>
    <select id="reason" name="reason" required>
      <option value="" disabled selected>Select a reason...</option>
      <option value="Report Site Issue">Report Site Issue</option>
      <option value="Commission Request" disabled>Commission Request</option>
      <option value="Other">Other</option>
    </select>

    <!-- Report Site Issue fields -->
    <div class="field-group" id="group-site-issue">
      <div class="field">
        <label for="affectedUrl">Affected URL</label>
        <input type="url" id="affectedUrl" name="affectedUrl" placeholder="https://example.com/page">
      </div>

      <div class="field">
        <label for="versionNumber">Version Number</label>
        <input type="text" id="versionNumber" name="versionNumber" placeholder="e.g. 1.4.2">
      </div>

      <div class="field span-3">
        <label for="issueDescription">Description of Issue</label>
        <textarea id="issueDescription" name="issueDescription" placeholder="What went wrong?"></textarea>
      </div>
    </div>

    <!-- Commission Request fields -->
    <div class="field-group" id="group-commission">
      <div class="field span-2">
        <label>Preferred Payment Method</label>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="Venmo">
            <span class="payment-badge badge-venmo">VENMO</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="PayPal">
            <span class="payment-badge badge-paypal">PAYPAL</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="Zelle">
            <span class="payment-badge badge-zelle">ZELLE</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="Revolut">
            <span class="payment-badge badge-revolut">REVOLUT</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="Cash App">
            <span class="payment-badge badge-cashapp">CASH APP</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="Chime">
            <span class="payment-badge badge-chime">CHIME</span>
          </label>
        </div>
      </div>

      <div class="field span-3">
        <label for="budgetSlider">Budget Range ($1 – $1000)</label>
        <div class="budget-row">
          <input type="range" id="budgetSlider" min="1" max="1000" value="100">
          <input type="number" id="budgetNumber" class="budget-number" min="1" max="1000" value="100">
        </div>
      </div>

      <div class="field span-3">
        <label for="commissionDescription">Description of Commission</label>
        <textarea id="commissionDescription" name="commissionDescription" placeholder="Describe what you'd like commissioned"></textarea>
      </div>
    </div>

    <!-- Other fields -->
    <div class="field-group" id="group-other">
      <div class="field span-3">
        <label for="otherDescription">Description</label>
        <textarea id="otherDescription" name="otherDescription" placeholder="Tell us more"></textarea>
      </div>
    </div>

    <button class="outra-link" aria-label="Submit Form" type="submit">Submit</button>
    <p class="note">Submitting opens your email client with the message pre-filled, addressed to admin@naklwilson.net.</p>
  </form>
</div>

  <script>
    const reasonSelect = document.getElementById('reason');
  const groups = {
    'Report Site Issue': document.getElementById('group-site-issue'),
    'Commission Request': document.getElementById('group-commission'),
    'Other': document.getElementById('group-other')
  };

  reasonSelect.addEventListener('change', () => {
    Object.values(groups).forEach(g => g.classList.remove('active'));
    const selected = groups[reasonSelect.value];
    if (selected) selected.classList.add('active');
  });

  const budgetSlider = document.getElementById('budgetSlider');
  const budgetNumber = document.getElementById('budgetNumber');

  budgetSlider.addEventListener('input', () => {
    budgetNumber.value = budgetSlider.value;
  });

  budgetNumber.addEventListener('input', () => {
    let val = parseInt(budgetNumber.value, 10);
    if (isNaN(val)) return;
    if (val < 1) val = 1;
    if (val > 1000) val = 1000;
    budgetSlider.value = val;
  });

  budgetNumber.addEventListener('blur', () => {
    let val = parseInt(budgetNumber.value, 10);
    if (isNaN(val) || val < 1) val = 1;
    if (val > 1000) val = 1000;
    budgetNumber.value = val;
    budgetSlider.value = val;
  });

  document.getElementById('contactForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const reason = reasonSelect.value;

    if (!name || !reason) {
      alert('Please fill out your name and select a reason.');
      return;
    }

    let subject = `${reason} - ${name}`;
    let bodyLines = [`Name: ${name}`, `Reason: ${reason}`, ''];

    if (reason === 'Report Site Issue') {
      bodyLines.push(`Affected URL: ${document.getElementById('affectedUrl').value}`);
      bodyLines.push(`Version Number: ${document.getElementById('versionNumber').value}`);
      bodyLines.push(`Description of Issue: ${document.getElementById('issueDescription').value}`);
    } else if (reason === 'Commission Request') {
      const paymentInput = document.querySelector('input[name="paymentMethod"]:checked');
      const payment = paymentInput ? paymentInput.value : '(none selected)';
      bodyLines.push(`Preferred Payment Method: ${payment}`);
      bodyLines.push(`Budget: $${budgetNumber.value}`);
      bodyLines.push(`Description of Commission: ${document.getElementById('commissionDescription').value}`);
    } else if (reason === 'Other') {
      bodyLines.push(`Description: ${document.getElementById('otherDescription').value}`);
    }

    const mailto = `mailto:admin@naklwilson.net?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyLines.join('\n'))}`;
    window.location.href = mailto;
  });
  window.addEventListener('pageshow', function () {
  document.getElementById('contactForm').reset();
});
</script>
