    <style>
        /* ELEMENTS */
        :root {
            color-scheme: light dark;
            --bg-color: light-dark(#6abaf0, #111213);
            --text-color: light-dark(#ffffff, #c7c7c7);
            --card-color: light-dark(#2f6fb7, #1c1e20);
            --navbtn-color: light-dark(#1753b6, #50596c);
            --navbtnhover-color: light-dark(#1753b6, #3b82f6);
            --navbtnactive-color: light-dark(#3b82f6, #979ca7);
            --navbtnactiveborder-color: light-dark(#6abaf0, #50596c);
            --navbar-color: light-dark(#2f6fb7, #1c1e20);
            --navborder-color: light-dark(#e5e5e5, #979ca7);
            --btnspace-color: light-dark(#43b72f, #5ec44d);
            --btnborder-color: light-dark(#e5e5e5, #979ca7);
            --btnactive-color: light-dark(#3b82f6, #1753b6);
            --btn-color: light-dark(#919bb1, #50596c);
            --btnhover-color: light-dark(#4a4f5a, #979ca7);
            --timerstop-color: light-dark(#b72f2f, #c44d4d);
            --timergo-color: light-dark(#43b72f, #5ec44d);
            --border-color: light-dark(#e5e5e5, #979ca7);
            --timerborder-color: light-dark(#e5e5e5, #979ca7);
            --timerbg-color: light-dark (#1753b6, #50596c);
        }

        html {
    font-size: 16px;
}

        h2 {
            color: var(--text-color);
        }

        [hidden] {
            display: none !important;
        }

        @font-face {
            font-family: 'ChocolateMono';
            src: url('./fonts/ChevyRay-Chocolate-Mono.ttf') format('truetype');
            /* Fallback */
            font-weight: normal;
            font-style: normal;
        }

        /* CLASS */
        .timers-container {
            display: flex;
            flex-flow: row wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 0.5rem;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            padding: auto;
        }

        .timerScreen-card {
            flex: 1 1 0px;
            min-width: 350px;
            max-width: 360px;
            height: 90%;
            min-height: auto;
            padding: 1rem;
            display: flex;
            flex-flow: column nowrap;
            gap: 0.5rem;
            align-content: center;
            align-items: center;
            justify-content: space-between;
            container-type: inline-size;
            container-name: card;
        }

        .timerDisplay {
            container-type: inline-size;
            width: clamp(130px, 20vw, 240px);
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12%;
            box-sizing: border-box;
            box-shadow: 0px 0px 25px 8px rgba(211, 211, 211, 0.5);
            background-color: var(--card-color);
        }

        .timerDisplay h1 {
            font-size: clamp(1.5rem, 28cqw, 2.8125rem);
            font-family: 'ChocolateMono', monospace;
            font-variant-numeric: tabular-nums;
            margin: 0;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
        }

        .timer-input-container,
        .sound-select-container {
            background-color: var(--navbtn-color);
            width: 90cqw;
            border: 5px solid var(--border-color);
            color: var(--text-color);
            padding: 1rem;
            width: 100%;
            min-width: 150px;
            max-width: 250px;
            border-radius: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .input-group label {
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            text-align: center;
        }

        .button-space,
        .button-alarm {
            width: 100%;
            margin-top: 5px;
        }

        .button-space button {
            width: 100%;
            padding: 10px;
            background-color: var(--btnspace-color);
            color: #FFFFFF;
            border: 2px solid var(--timergo-color);
            border-radius: 4px;
            cursor: pointer;
        }

        .button-alarm button {
            width: 100%;
            padding: 10px;
            background-color: var(--btn-color);
            color: #FFFFFF;
            border: 2px solid var(--btnborder-color);
            border-radius: 4px;
            cursor: pointer;
        }

        .timerDisplay.is-running {
            box-shadow: 0px 0px 25px 8px rgba(67, 183, 47, 0.5) !important;
            background-color: rgba(24, 66, 17, 0.5);
        }

        .timerDisplay.is-stopped {
            box-shadow: 0px 0px 25px 8px rgba(183, 47, 47, 0.5) !important;
            background-color: rgba(73, 18, 18, 0.5);
        }

        .button {
            border: 2px solid var(--border-color);
            background-color: var(--btn-color);
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-color);
            font-size: 18px;
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            align-content: center;
            align-items: center;
            justify-content: space-evenly;
        }

        .logo {
            display: block;
            width: 60cqw;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: contain;
        }

        .logo-button {
            width: auto;
            height: clamp(100px, 10vh, 330px);
            aspect-ratio: auto;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .logo-button img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .logo-picture {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .button:hover {
            color: var(--bg-color);
            background-color: var(--btnhover-color);
            border: 2px solid var(--navbtn-color);
        }

        .time {
            color: var(--text-color);
        }

        .time.is-running {
            color: var(--timergo-color);
        }

        .time.is-stopped {
            color: var(--timerstop-color);
        }


        .navbar-container {
            display: flex;
            flex-direction: row wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
            padding: 10px;
            background-color: var(--navbar-color);
            border: 5px solid var(--border-color);
            border-radius: 30px;
        }

        .nav-btn {
            padding: 2px 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid #e5e5e5;
            background-color: var(--navbtn-color);
            color: var(--text-color);
            border-radius: 6px;
            transition: all 0.2s ease;
            flex: 1 1 calc(33.333% - 12px);
            min-width: 70px;
            text-align: center;
            min-height: 44px;
            max-width: 100%;
            max-height: 300px;
        }

        .nav-btn:hover {
            background-color: var(--navbtnhover-color);
            border: 2px solid var(--navbtnhover-color);
        }

        .nav-btn.active,
        .button.active {
            border-color: var(--navbtnactiveborder-color);
            background-color: var(--navbtnactive-color);
        }

        .hidden-on-desktop {
            display: none !important;
        }

        .ui-picture {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .ui-button {
            display: flex;
            flex-direction: row wrap;
            width: auto;
            height: 32px;
            max-height: 100%;
            object-fit: contain;
        }

        /* ID */
        #timerScreen-yo {
            border: 5px solid var(--border-color);
            border-radius: 30px;
            background-color: var(--card-color);
            box-shadow: 10px 10px 50px rgba(128, 128, 128, 0.3);
        }

        #timerScreen-op {
            border: 5px solid var(--border-color);
            border-radius: 30px;
            background-color: var(--card-color);
            box-shadow: 10px 10px 50px rgba(128, 128, 128, 0.3);
        }

        #timerScreen-rb {
            border: 5px solid var(--border-color);
            border-radius: 30px;
            background-color: var(--card-color);
            box-shadow: 10px 10px 50px rgba(128, 128, 128, 0.3);
        }

        #timerScreen-ua {
            border: 5px solid var(--border-color);
            border-radius: 30px;
            background-color: var(--card-color);
            box-shadow: 10px 10px 50px rgba(128, 128, 128, 0.3);
        }

        #timerScreen-ga {
            border: 5px solid var(--border-color);
            border-radius: 30px;
            background-color: var(--card-color);
            box-shadow: 10px 10px 50px rgba(128, 128, 128, 0.3);
        }

        #timerScreen-dm {
            border: 5px solid var(--border-color);
            border-radius: 30px;
            background-color: var(--card-color);
            box-shadow: 10px 10px 50px rgba(128, 128, 128, 0.3);
        }

        #timerDisplay-yo {
            border: 5px solid var(--border-color);
            border-radius: 50%;
            font-weight: bold;
        }

        #timerDisplay-op {
            border: 5px solid var(--border-color);
            border-radius: 50%;
            font-weight: bold;
        }

        #timerDisplay-rb {
            border: 5px solid var(--border-color);
            border-radius: 50%;
            font-weight: bold;
        }

        #timerDisplay-ua {
            border: 5px solid var(--border-color);
            border-radius: 50%;
            font-weight: bold;
        }

        #timerDisplay-ga {
            border: 5px solid var(--border-color);
            border-radius: 50%;
            font-weight: bold;
        }

        #timerDisplay-dm {
            border: 5px solid var(--border-color);
            border-radius: 50%;
            font-weight: bold;
        }

        /* Keep button layout perfectly aligned */
        #startBtn-yo,
        .button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            /* Clean uniform padding over text padding dimensions */
        }

        #button-container {
            margin-top: 5px;
        }

        /* MOBILE */

        @media (max-width: 1285px) {

            .nav-btn {
                flex: 0 0 auto;
                min-height: auto;
                border: 1px solid var(--border-color);
            }

            .nav-btn:hover {
                flex: 0 0 auto;
                min-height: auto;
                border: 1px solid var(--navborder-color);
            }

            .navbar-container {
                border: 0px solid var(--border-color);
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                justify-content: center;
                align-items: center;
                gap: 12px;
                padding: 5px;
                background-color: var(--navbar-color);
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                scroll-behavior: smooth;
                scrollbar-width: thin;
                border: 4px solid var(--border-color);

            }

            .navbar-container::-webkit-scrollbar {
                height: 6px;
            }

            .navbar-container::-webkit-scrollbar-thumb {
                background: var(--navbar-color);
                border-radius: 10px;
            }

            .logo-button {
                width: auto;
                height: clamp(80px, 6vh, 100px);
                aspect-ratio: auto;
                display: inline-flex;
                justify-content: center;
                align-items: center;
            }

            .timerScreen-card {
                flex: 1;
                min-width: 280px;
                max-width: 280px;
                min-height: 400px;
                padding: 1rem;
                display: flex;
                flex-flow: row wrap;
                gap: 1rem;
                align-content: center;
                align-items: center;
                justify-content: space-evenly;
                container-type: inline-size;
                container-name: card;
            }

        }

        @media (max-width: 780px) {

            .timerScreen-card {
                flex: 1;
                min-width: 150px;
                max-width: 280px;
                min-height: 400px;
                padding: 1rem;
                display: flex;
                flex-flow: row wrap;
                gap: 1rem;
                align-content: center;
                align-items: center;
                justify-content: space-evenly;
                container-type: inline-size;
                container-name: card;
            }

            .navbar-container {
                border: 0px solid var(--border-color);
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                justify-content: flex-start;
                align-items: center;
                gap: 12px;
                padding: 10px;
                background-color: var(--navbar-color);
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                scroll-behavior: smooth;
                scrollbar-width: thin;
                border: 4px solid var(--border-color);

            }
        }
</style>
</head>
